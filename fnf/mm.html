<!DOCTYPE html>
<html>
<head>
    <title>FNF Mod HTML Generator</title>
</head>

<body style="margin:0; background:#111; color:white; font-family:sans-serif;">

<div style="height:100vh; display:flex; flex-direction:column;">

    <!-- TOP BAR -->
    <div style="padding:10px; background:#000;">
        <input id="modUrls" placeholder="Enter GitHub RAW mod URLs (comma separated)" style="width:500px;">
        <button onclick="generate()">Generate</button>
        <button onclick="downloadHTML()">Download</button>
        <button onclick="copyHTML()">Copy</button>
    </div>

    <!-- OUTPUT -->
    <textarea id="output" style="flex:1; width:100%; box-sizing:border-box;"></textarea>

</div>

<script>
let generatedHTML = "";

function generate() {
    const input = document.getElementById("modUrls").value.trim();

    if (!input) {
        alert("Enter at least one mod URL!");
        return;
    }

    const urls = input.split(",").map(u => u.trim()).filter(u => u);

    generatedHTML = `<!DOCTYPE html>
<html>
<head>
<base href="https://cdn.jsdelivr.net/gh/genizy/fridayfunk@65da3b8e88b909a8e27f8d750533a758d8dc54f3/">
<meta charset="utf-8">
<title>FNF Multi Mod Player</title>

<script src="Funkin.js"><\\/script>

<style>
html,body { margin:0; padding:0; background:black; overflow:hidden; }
#openfl-content { width:100%; height:100%; }
#modMenu {
    position:fixed;
    top:10px;
    left:10px;
    background:#111;
    padding:10px;
    border-radius:8px;
    z-index:9999;
    color:white;
    font-family:sans-serif;
}
button { margin-top:5px; }
</style>
</head>

<body>

<div id="modMenu">
<b>Mods</b><br>
${urls.map((u,i)=>`<button onclick="loadMod(${i})">Mod ${i+1}</button>`).join("")}
</div>

<div id="openfl-content"></div>

<script>

window.modAssets = {};
const modBases = ${JSON.stringify(urls)};

function normalizePath(path) {
    return path.toLowerCase().replace(/^.*?(data|images|songs|characters)/, "$1");
}

function tryPaths(base, paths) {
    return Promise.any(paths.map(p =>
        fetch(base + p).then(r => {
            if (!r.ok) throw new Error();
            return r.blob().then(b => ({ path:p, blob:b }));
        })
    ));
}

async function loadMod(index) {
    window.modAssets = {};
    const base = modBases[index];

    console.log("Loading mod:", base);

    // Common FNF files to try (no manifest needed)
    const commonFiles = [
        "data/tutorial/tutorial.json",
        "songs/tutorial/Inst.ogg",
        "songs/tutorial/Voices.ogg",
        "images/characters/bf.png"
    ];

    const promises = commonFiles.map(async (file) => {
        try {
            const res = await fetch(base + file);
            if (res.ok) {
                const blob = await res.blob();
                const clean = normalizePath(file);
                const url = URL.createObjectURL(blob);
                window.modAssets[clean] = url;
            }
        } catch {}
    });

    await Promise.all(promises);

    alert("Mod loaded!");
}

// FETCH OVERRIDE
const originalFetch = window.fetch;

window.fetch = async function(resource, options) {
    if (typeof resource === "string") {
        const path = normalizePath(resource);
        if (window.modAssets[path]) {
            return originalFetch(window.modAssets[path]);
        }
    }
    return originalFetch(resource, options);
};

// START GAME
lime.embed("Funkin", "openfl-content", 1280, 720, { parameters: {} });

<\\/script>

</body>
</html>`;

    document.getElementById("output").value = generatedHTML;
}

// DOWNLOAD
function downloadHTML() {
    if (!generatedHTML) return alert("Generate first!");

    const blob = new Blob([generatedHTML], { type: "text/html" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "fnf-multi-mod.html";
    a.click();

    URL.revokeObjectURL(url);
}

// COPY
function copyHTML() {
    if (!generatedHTML) return alert("Generate first!");

    navigator.clipboard.writeText(generatedHTML);
    alert("Copied!");
}
</script>

</body>
</html>
