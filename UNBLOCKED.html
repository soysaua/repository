<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>()</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .play-button {
      padding: 20px 40px;
      background: #000;
      color: #fff;
      border: 2px solid #4a148c;
      border-radius: 10px;
      font: bold 24px Arial;
      cursor: pointer;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1001;
    }
    .play-button:hover { background: #4a148c; }
    .fullscreen-button {
      padding: 10px 15px;
      background: #000;
      color: #fff;
      border: 2px solid #4a148c;
      border-radius: 5px;
      font: bold 14px Arial;
      cursor: pointer;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1002;
    }
    .fullscreen-button:hover { background: #4a148c; }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="fr" width="100%" height="100%" frameborder="0" allowfullscreen style="display:none;"></iframe>
    <button class="play-button" type="button" onclick="PlayTo(this)">PLAY REGULAR</button>
    <button class="fullscreen-button" type="button" onclick="openFullscreen()">OPEN UNDETECTABLE</button>
  </div>

  <script>
    const GAME_URL = "(GAME_URL)";

    function PlayTo(button) {
      const iframe = document.getElementById("fr");
      iframe.src = GAME_URL;
      iframe.style.display = "block";
      button.style.display = "none";
    }

    function openFullscreen() {
      const newWindow = window.open("", "_blank");
      if (newWindow) {
        newWindow.document.write(
          `<html><head><meta charset="utf-8"><title>OTHER PAGE TITLE(SAME TITLE)</title><style>html,body{height:100%;margin:0}iframe{border:0;width:100%;height:100%}</style></head><body><iframe src="${GAME_URL}" allowfullscreen></iframe></body></html>`
        );
        newWindow.document.close();
      } else {
        alert("Fullscreen could not be opened.");
      }
    }
  </script>
</body>
</html>
